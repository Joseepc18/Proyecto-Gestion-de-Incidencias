services:
  # 1. Base de Datos (Relacional: PostgreSQL)
  db:
    image: postgres:16
    container_name: incidencias_db
    ports:
      - "127.0.0.1:5433:5432"
    restart: always
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: gestion_incidencias
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d gestion_incidencias" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - incidencias_network

  # 1.2 Servidor de Caché (Redis)
  redis:
    image: redis:alpine
    container_name: incidencias_redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-secreto}"]
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - incidencias_network

  # 2. Backend (Laravel API REST)
  backend:
    restart: unless-stopped
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Sin command: la imagen php:8.3-fpm arranca PHP-FPM (FastCGI en :9000)
    expose:
      - "9000"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-secreto}
    volumes:
      - ./backend:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "php -r 'echo 1;' || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - incidencias_network
    deploy:
      mode: replicated
      replicas: 2

  # 3. Servidor Web y Balanceador de Carga (Nginx)
  frontend:
    image: nginx:alpine
    container_name: incidencias_frontend_lb
    restart: unless-stopped
    mem_limit: 192m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      # Fotos subidas: con PHP-FPM ya no las sirve artisan, las sirve Nginx directo (solo lectura)
      - ./backend/storage/app/public:/var/www/storage:ro
    depends_on:
      - backend
    networks:
      - incidencias_network

  # 4. Servidor de WebSockets (Laravel Reverb)
  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: incidencias_reverb
    command: php artisan reverb:start --host="0.0.0.0" --port=8080
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/var/www/html
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-secreto}
    depends_on:
      - redis
    networks:
      - incidencias_network


networks:
  incidencias_network:
    driver: bridge

volumes:
  pgdata:
