services:
  # 1. Base de Datos (Relacional: PostgreSQL)
  db:
    image: postgres:16
    container_name: incidencias_db
    ports:
      - "127.0.0.1:5433:5432"
    restart: always
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: gestion_incidencias
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d gestion_incidencias" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - incidencias_network

  # 1.2 Servidor de Caché (Redis)
  redis:
    image: redis:alpine
    container_name: incidencias_redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?falta REDIS_PASSWORD en .env}"]
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD:?falta REDIS_PASSWORD en .env}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - incidencias_network

  # 2. Backend (Laravel API REST)
  backend:
    restart: unless-stopped
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Sin command: la imagen php:8.3-fpm arranca PHP-FPM (FastCGI en :9000)
    expose:
      - "9000"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?falta REDIS_PASSWORD en .env}
    volumes:
      - ./backend:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "php -r 'echo 1;' || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - incidencias_network
    deploy:
      mode: replicated
      replicas: 2

  # 3. Servidor Web y Balanceador de Carga (Nginx)
  frontend:
    image: nginx:alpine
    container_name: incidencias_frontend_lb
    restart: unless-stopped
    mem_limit: 192m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"
    volumes:
      # En prod se pone FRONTEND_ROOT=./frontend/dist en el .env (sirve el build); en dev queda el árbol crudo.
      - ${FRONTEND_ROOT:-./frontend}:/usr/share/nginx/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      # Credenciales del Basic Auth de /horizon; se crea a mano en cada entorno (gitignored)
      - ./nginx/horizon.htpasswd:/etc/nginx/horizon.htpasswd:ro
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/login/login.html || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - incidencias_network

  # 4. Servidor de WebSockets (Laravel Reverb) para el chat en tiempo real
  reverb:
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: incidencias_reverb
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@fsockopen('127.0.0.1', 8080) ? 0 : 1);\""]
      interval: 30s
      timeout: 10s
      retries: 3
    expose:
      - "8080"
    volumes:
      - ./backend:/var/www/html
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?falta REDIS_PASSWORD en .env}
    depends_on:
      - redis
    networks:
      - incidencias_network

  # 5. Worker de colas (Laravel Horizon sobre Redis): procesa mail y notificaciones diferidas
  # para que no bloqueen la respuesta HTTP. Tras cada deploy hay que reiniciarlo (carga el código en memoria).
  horizon:
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: incidencias_horizon
    command: php artisan horizon
    # El check arranca todo el framework (php artisan): con carga alta el arranque frío pasaba los 10s
    # y daba falso unhealthy. timeout amplio + start_period de gracia al arrancar.
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status | grep -q running || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s
    volumes:
      - ./backend:/var/www/html
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?falta REDIS_PASSWORD en .env}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - incidencias_network

  # 6. Scheduler de Laravel (tareas programadas, ej. auto-archivado de incidencias resueltas)
  scheduler:
    restart: unless-stopped
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: incidencias_scheduler
    command: php artisan schedule:work
    # Mismo motivo que horizon: php artisan arranca el framework; timeout amplio + start_period.
    healthcheck:
      test: ["CMD-SHELL", "php artisan schedule:list > /dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s
    volumes:
      - ./backend:/var/www/html
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?falta REDIS_PASSWORD en .env}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - incidencias_network


networks:
  incidencias_network:
    driver: bridge

volumes:
  pgdata:
