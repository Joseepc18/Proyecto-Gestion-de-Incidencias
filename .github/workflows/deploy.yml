name: Deploy - Aplicación (Backend + Frontend)

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Traer últimos cambios
        working-directory: /home/dayronqv/Proyecto-Gestion-de-Incidencias
        run: git pull origin develop

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Assets del panel Blade (Vite → backend/public/build). El contenedor backend los ve por bind-mount.
      - name: Build de assets del panel (Vite)
        working-directory: /home/dayronqv/Proyecto-Gestion-de-Incidencias/backend
        run: npm ci && npm run build

      # SPA estático minificado + hasheado (esbuild → frontend/dist). Nginx lo sirve vía FRONTEND_ROOT.
      - name: Build del SPA (esbuild)
        working-directory: /home/dayronqv/Proyecto-Gestion-de-Incidencias/frontend
        run: npm ci && npm run build

      - name: Reiniciar el backend
        working-directory: /home/dayronqv/Proyecto-Gestion-de-Incidencias
        run: docker compose restart backend

      - name: Reiniciar el frontend (nginx)
        working-directory: /home/dayronqv/Proyecto-Gestion-de-Incidencias
        run: docker compose restart frontend
