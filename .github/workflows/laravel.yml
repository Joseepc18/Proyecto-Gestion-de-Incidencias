name: CI - Laravel Backend

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gestion_incidencias_test
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_pgsql, mbstring, tokenizer, xml, ctype, json
          coverage: none

      - name: Instalar dependencias
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copiar .env de pruebas
        working-directory: backend
        run: cp .env.example .env

      - name: Generar clave de Laravel
        working-directory: backend
        run: php artisan key:generate

      - name: Ejecutar migraciones
        working-directory: backend
        run: php artisan migrate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: gestion_incidencias_test
          DB_USERNAME: admin
          DB_PASSWORD: password123

      - name: Ejecutar Tests (PHPUnit)
        working-directory: backend
        run: php artisan test --testdox
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: gestion_incidencias_test
          DB_USERNAME: admin
          DB_PASSWORD: password123
