name: CI - Laravel Backend

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo, pdo_sqlite, mbstring, tokenizer, xml, ctype, json
          coverage: none

      - name: Instalar dependencias
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copiar .env de pruebas
        working-directory: backend
        run: cp .env.example .env

      - name: Generar clave de Laravel
        working-directory: backend
        run: php artisan key:generate

      - name: Ejecutar migraciones (SQLite en memoria)
        working-directory: backend
        run: php artisan migrate --force
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"

      - name: Ejecutar Tests (PHPUnit)
        working-directory: backend
        run: php artisan test --testdox
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
