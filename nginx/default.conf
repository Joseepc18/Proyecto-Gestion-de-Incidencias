# upstream: backend PHP-FPM (FastCGI en :9000). El DNS de Docker reparte entre
# las 2 réplicas (balanceo de carga).
upstream api_backend {
    server backend:9000;
}

server {
    listen 80;                       # Nginx escucha en el puerto 80 público
    server_name localhost;
    server_tokens off;               # Oculta la versión de Nginx en cabeceras/errores

    client_max_body_size 15M;        # Tope del cuerpo de la petición (varias fotos por subida)

    # La raíz "/" redirige a la página de login (ahora vive en login/)
    location = / {
        return 302 /login/login.html;
    }

    # HTML/JS/CSS → sin caché, así los cambios se ven sin recargar a la fuerza
    location ~* \.(?:html|js|css)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Resto de peticiones → sirve los archivos del frontend
    location / {
        root /usr/share/nginx/html;  # carpeta donde Nginx busca los archivos
        try_files $uri $uri/ =404;   # busca el archivo, si no existe → 404
    }

    # Peticiones a /api/ → las ejecuta PHP-FPM por FastCGI (front-controller de Laravel)
    location /api/ {
        fastcgi_pass api_backend;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param HTTP_X_FORWARDED_FOR   $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
    }

    # Peticiones a /storage/ → fotos subidas, servidas por Nginx directo (ya no PHP)
    location /storage/ {
        alias /var/www/storage/;
        access_log off;
        try_files $uri =404;
    }
}