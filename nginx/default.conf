# upstream: define el grupo de servidores backend.
# "backend" es el nombre del servicio en docker-compose.yml.
upstream api_backend {
    server backend:8000;
}

server {
    listen 80;                       # Nginx escucha en el puerto 80 público
    server_name localhost;

    # Peticiones a / → sirve los archivos HTML del frontend
    location / {
        root /usr/share/nginx/html;  # carpeta donde Nginx busca los HTML
        index login.html dashboard.html;
        try_files $uri $uri/ =404;   # busca el archivo, si no existe → 404
    }

    # Peticiones a /api/ → las reenvía a las réplicas de Laravel
    location /api/ {
        proxy_pass http://api_backend/api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Peticiones a /storage/ → archivos subidos (fotos de incidencias)
    location /storage/ {
        proxy_pass http://api_backend/storage/;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
