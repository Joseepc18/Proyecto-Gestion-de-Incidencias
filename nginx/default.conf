# upstream: backend PHP-FPM (FastCGI en :9000). El DNS de Docker reparte entre
# las 2 réplicas (balanceo de carga).
upstream api_backend {
    server backend:9000;
}

# Cloudflare termina el TLS y entra por el túnel a nginx en HTTP, así que aquí $scheme
# siempre es "http" y pisaría el esquema real del visitante. Para que Laravel y sus URLs
# firmadas (evidencias, fotos de perfil, enlaces de correo) sepan el esquema verdadero,
# preferimos el X-Forwarded-Proto que envía Cloudflare y caemos a $scheme si no viene (dev).
map $http_x_forwarded_proto $proto_visitante {
    default $scheme;
    https   https;
    http    http;
}

server {
    listen 80;                       # Nginx escucha en el puerto 80 público
    server_name localhost;
    server_tokens off;               # Oculta la versión de Nginx en cabeceras/errores

    client_max_body_size 15M;        # Tope del cuerpo de la petición (varias fotos por subida)

    # No filtrar la versión de PHP en las respuestas (X-Powered-By) de las rutas FastCGI.
    fastcgi_hide_header X-Powered-By;

    # Cabeceras de seguridad a nivel server (las heredan /api/, /storage/ y demás).
    # Ojo: nginx NO hereda add_header en un location que declare su propio add_header,
    # por eso estas cabeceras se repiten en los dos bloques de caché de abajo.
    # La CSP contempla: tiles Esri/OSM (img), worker de compresión de fotos (blob), y Reverb (wss same-origin = 'self').
    # Los 2 sha256 de script-src son inline pre-paint del build: tema-inicial.js (evita flash de tema) y el guard de sesión de login/verificar-correo; si cambian esos scripts hay que recalcular el hash. static/cloudflareinsights = beacon de Web Analytics de Cloudflare.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: blob: https://server.arcgisonline.com https://*.tile.openstreetmap.org; style-src 'self' 'unsafe-inline'; script-src 'self' 'sha256-qzWdB7u0Yfs0upU+tyB7xCWxu8DzQIwhTTHl1rNsgO0=' 'sha256-A97l3jv1nh+3sXdzbFI2Uhmn4xRjq8+0bngYdpNqWGI=' https://static.cloudflareinsights.com; worker-src 'self' blob:; connect-src 'self' https://cloudflareinsights.com; font-src 'self' data:" always;

    # Páginas de error amigables para las navegaciones del frontend.
    # No afectan a /api/: Laravel devuelve su propio JSON (fastcgi_intercept_errors va apagado).
    error_page 404 /error/404.html;
    error_page 500 502 503 504 /error/500.html;

    # La raíz "/" redirige a la página de login (ahora vive en login/)
    location = / {
        return 302 /login/login.html;
    }

    # Bundles propios del SPA con hash de contenido (esbuild) → caché eterna: si cambia el contenido
    # cambia el nombre, así que un deploy nunca necesita purga de Cloudflare para nuestros .js/.css.
    location ^~ /assets/build/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # Repetidas porque este add_header propio corta la herencia de las del server.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: blob: https://server.arcgisonline.com https://*.tile.openstreetmap.org; style-src 'self' 'unsafe-inline'; script-src 'self' 'sha256-qzWdB7u0Yfs0upU+tyB7xCWxu8DzQIwhTTHl1rNsgO0=' 'sha256-A97l3jv1nh+3sXdzbFI2Uhmn4xRjq8+0bngYdpNqWGI=' https://static.cloudflareinsights.com; worker-src 'self' blob:; connect-src 'self' https://cloudflareinsights.com; font-src 'self' data:" always;
        try_files $uri =404;
    }

    # HTML y assets sin hash (vendors en dev/prod, fuentes propias en dev) → sin caché, así los
    # cambios se ven sin recargar a la fuerza y el HTML siempre referencia los hashes vigentes.
    location ~* \.(?:html|js|css)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
        # Repetidas porque este add_header propio corta la herencia de las del server (aquí se sirve el HTML).
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: blob: https://server.arcgisonline.com https://*.tile.openstreetmap.org; style-src 'self' 'unsafe-inline'; script-src 'self' 'sha256-qzWdB7u0Yfs0upU+tyB7xCWxu8DzQIwhTTHl1rNsgO0=' 'sha256-A97l3jv1nh+3sXdzbFI2Uhmn4xRjq8+0bngYdpNqWGI=' https://static.cloudflareinsights.com; worker-src 'self' blob:; connect-src 'self' https://cloudflareinsights.com; font-src 'self' data:" always;
        try_files $uri =404;
    }

    # Resto de peticiones → sirve los archivos del frontend
    location / {
        root /usr/share/nginx/html;  # carpeta donde Nginx busca los archivos
        try_files $uri $uri/ =404;   # busca el archivo, si no existe → 404
    }

    # WebSockets de Reverb (chat en tiempo real): /app es el handshake del protocolo Pusher.
    # Resolver dinámico (DNS de Docker) para no romper si el contenedor reverb se recrea.
    location /app {
        resolver 127.0.0.11 valid=10s;
        set $reverb_upstream reverb:8080;
        proxy_pass http://$reverb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_visitante;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Peticiones a /api/ → las ejecuta PHP-FPM por FastCGI (front-controller de Laravel)
    location /api/ {
        fastcgi_pass api_backend;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param HTTP_X_FORWARDED_FOR   $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $proto_visitante;
    }

    # Panel de Laravel Horizon (colas). La app es stateless (sin sesión web para el Gate de Horizon),
    # así que la protección real es este Basic Auth en el borde; el htpasswd se crea a mano (gitignored).
    # Horizon v5 inyecta su CSS/JS inline, por eso basta enrutar /horizon al front-controller.
    location /horizon {
        auth_basic "Horizon";
        auth_basic_user_file /etc/nginx/horizon.htpasswd;
        # CSP propia (corta la herencia de la global): Horizon inyecta su JS/CSS inline,
        # la CSP estricta del resto del sitio lo bloqueaba y dejaba el panel en blanco.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self'; font-src 'self' data:; img-src 'self' data:" always;
        fastcgi_pass api_backend;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param HTTP_X_FORWARDED_FOR   $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $proto_visitante;
    }

    # Panel de Laravel Pulse (rendimiento). Mismo Basic Auth de /horizon: la app es stateless,
    # así que la protección real vuelve a ser este candado de borde, no el Gate interno del paquete.
    location /pulse {
        auth_basic "Pulse";
        auth_basic_user_file /etc/nginx/horizon.htpasswd;
        # CSP propia (misma razón que /horizon): Pulse también inyecta su JS/CSS inline
        # y usa Alpine.js, que evalúa sus expresiones x-data en runtime (necesita unsafe-eval).
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self'; font-src 'self' data:; img-src 'self' data:" always;
        fastcgi_pass api_backend;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param HTTP_X_FORWARDED_FOR   $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $proto_visitante;
    }

    # Endpoint AJAX de Livewire (usado por Pulse para traer sus datos). Laravel lo registra bajo
    # un prefijo /livewire-<hash> derivado de APP_KEY; sin esta ruta caía al SPA estático (404) y
    # las tarjetas de Pulse se quedaban en el esqueleto de carga. Mismo Basic Auth que /pulse:
    # si no, cualquiera podría pegarle directo a este endpoint sin pasar por el candado.
    # Va con ^~ (prefijo prioritario) y no con ~ (regex): entre regex gana la PRIMERA del archivo,
    # y la de estáticos \.(html|js|css)$ está más arriba, así que se quedaba con livewire.min.js
    # y lo buscaba en el SPA (404). Con ^~ el prefijo gana sobre cualquier regex, esté donde esté.
    location ^~ /livewire {
        auth_basic "Pulse";
        auth_basic_user_file /etc/nginx/horizon.htpasswd;
        fastcgi_pass api_backend;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param HTTP_X_FORWARDED_FOR   $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $proto_visitante;
    }

    # Panel de Laravel Telescope (solo entorno local). Sin Basic Auth: la protección real es que
    # el service provider ni siquiera se registra fuera de local (ver AppServiceProvider), así que
    # en prod esta ruta cae directo a un 404 de Laravel.
    location /telescope {
        fastcgi_pass api_backend;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param HTTP_X_FORWARDED_FOR   $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $proto_visitante;
    }

    # Peticiones a /storage/ → fotos subidas, servidas por Nginx directo (ya no PHP)
    location /storage/ {
        alias /var/www/storage/;
        access_log off;
        try_files $uri =404;
    }
}