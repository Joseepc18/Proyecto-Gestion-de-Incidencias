# upstream: backend PHP-FPM (FastCGI en :9000). El DNS de Docker reparte entre
# las 2 réplicas (balanceo de carga).
upstream api_backend {
    server backend:9000;
}

server {
    listen 80;                       # Nginx escucha en el puerto 80 público
    server_name localhost;
    server_tokens off;               # Oculta la versión de Nginx en cabeceras/errores

    client_max_body_size 15M;        # Tope del cuerpo de la petición (varias fotos por subida)

    # Páginas de error amigables para las navegaciones del frontend.
    # No afectan a /api/: Laravel devuelve su propio JSON (fastcgi_intercept_errors va apagado).
    error_page 404 /error/404.html;
    error_page 500 502 503 504 /error/500.html;

    # La raíz "/" redirige a la página de login (ahora vive en login/)
    location = / {
        return 302 /login/login.html;
    }

    # Bundles propios del SPA con hash de contenido (esbuild) → caché eterna: si cambia el contenido
    # cambia el nombre, así que un deploy nunca necesita purga de Cloudflare para nuestros .js/.css.
    location ^~ /assets/build/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # HTML y assets sin hash (vendors en dev/prod, fuentes propias en dev) → sin caché, así los
    # cambios se ven sin recargar a la fuerza y el HTML siempre referencia los hashes vigentes.
    location ~* \.(?:html|js|css)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Resto de peticiones → sirve los archivos del frontend
    location / {
        root /usr/share/nginx/html;  # carpeta donde Nginx busca los archivos
        try_files $uri $uri/ =404;   # busca el archivo, si no existe → 404
    }

    # WebSockets de Reverb (chat en tiempo real): /app es el handshake del protocolo Pusher.
    # Resolver dinámico (DNS de Docker) para no romper si el contenedor reverb se recrea.
    location /app {
        resolver 127.0.0.11 valid=10s;
        set $reverb_upstream reverb:8080;
        proxy_pass http://$reverb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Peticiones a /api/ → las ejecuta PHP-FPM por FastCGI (front-controller de Laravel)
    location /api/ {
        fastcgi_pass api_backend;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param HTTP_X_FORWARDED_FOR   $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
    }

    # Panel de Laravel Horizon (colas). La app es stateless (sin sesión web para el Gate de Horizon),
    # así que la protección real es este Basic Auth en el borde; el htpasswd se crea a mano (gitignored).
    # Horizon v5 inyecta su CSS/JS inline, por eso basta enrutar /horizon al front-controller.
    location /horizon {
        auth_basic "Horizon";
        auth_basic_user_file /etc/nginx/horizon.htpasswd;
        fastcgi_pass api_backend;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param HTTP_X_FORWARDED_FOR   $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
    }

    # Panel de Laravel Pulse (rendimiento). Mismo Basic Auth de /horizon: la app es stateless,
    # así que la protección real vuelve a ser este candado de borde, no el Gate interno del paquete.
    location /pulse {
        auth_basic "Pulse";
        auth_basic_user_file /etc/nginx/horizon.htpasswd;
        fastcgi_pass api_backend;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param HTTP_X_FORWARDED_FOR   $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
    }

    # Panel de Laravel Telescope (solo entorno local). Sin Basic Auth: la protección real es que
    # el service provider ni siquiera se registra fuera de local (ver AppServiceProvider), así que
    # en prod esta ruta cae directo a un 404 de Laravel.
    location /telescope {
        fastcgi_pass api_backend;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param HTTP_X_FORWARDED_FOR   $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
    }

    # Peticiones a /storage/ → fotos subidas, servidas por Nginx directo (ya no PHP)
    location /storage/ {
        alias /var/www/storage/;
        access_log off;
        try_files $uri =404;
    }
}