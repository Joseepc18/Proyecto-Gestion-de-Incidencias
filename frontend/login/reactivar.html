<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Solicitar reactivación de cuenta - Sistema de Gestión de Incidencias"
    />
    <title>Solicitar reactivación | Gestión de Incidencias</title>

    <link rel="icon" href="../assets/images/favicon/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../assets/images/favicon/favicon-32x32.png"
    />
    <link rel="apple-touch-icon" href="../assets/images/favicon/apple-icon.png" />
    <script src="../assets/js/tema-inicial.js"></script>
    <link rel="stylesheet" href="../assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="../assets/vendors/bootstrap-icons/bootstrap-icons.css" />
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>

  <body class="auth-body">
    <button
      class="icon-button theme-toggle auth-theme-toggle"
      type="button"
      data-theme-toggle
      aria-label="Cambiar tema"
      title="Cambiar tema"
    >
      <i class="bi bi-moon-stars" data-theme-icon aria-hidden="true"></i>
    </button>

    <main class="auth-page">
      <div class="card shadow-sm auth-solo-card">
        <div class="card-body p-4 p-sm-5">
          <form id="reactivarForm" class="needs-validation" novalidate>
            <div class="mb-4">
              <p class="eyebrow mb-1">Acceso seguro</p>
              <h1 class="h3 mb-1">Solicitar reactivación</h1>
              <p class="text-muted mb-0">
                Si tu cuenta fue suspendida, cuéntanos por qué deberíamos reactivarla y un
                administrador revisará tu solicitud.
              </p>
            </div>

            <div id="reactivarError" class="alert alert-danger d-none" role="alert"></div>
            <div id="reactivarOk" class="alert alert-success d-none" role="alert"></div>

            <div class="mb-3">
              <label class="form-label" for="reactivarEmail">Correo electrónico</label>
              <input class="form-control" id="reactivarEmail" type="email" required />
              <div class="invalid-feedback">Ingresa un correo válido.</div>
            </div>

            <div class="mb-3" id="reactivarMotivo"></div>

            <button id="reactivarSubmit" class="btn btn-primary w-100" type="submit">
              <span
                id="reactivarSpinner"
                class="spinner-border spinner-border-sm d-none"
                role="status"
                aria-hidden="true"
              ></span>
              <i class="bi bi-send" aria-hidden="true"></i> Enviar solicitud
            </button>

            <div class="auth-footer">
              <a href="login.html" class="auth-link">Volver a iniciar sesión</a>
            </div>
          </form>
        </div>
      </div>
    </main>

    <script defer src="../assets/js/bootstrap.bundle.min.js"></script>
    <script defer src="../assets/vendors/main.js"></script>
    <script defer src="../assets/js/config.js"></script>
    <script defer src="../assets/js/api.js"></script>
    <script defer src="../assets/js/toast.js"></script>
    <script defer src="../assets/js/modal.js"></script>
    <script defer src="reactivar.js"></script>
  </body>
</html>
