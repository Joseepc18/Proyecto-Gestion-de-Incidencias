<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ingresando…</title>
    <link rel="icon" href="../assets/images/favicon/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../assets/images/favicon/favicon-32x32.png"
    />
    <link rel="apple-touch-icon" href="../assets/images/favicon/apple-icon.png" />
    <script src="../assets/js/tema-inicial.js"></script>
    <link rel="stylesheet" href="../assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="../assets/vendors/bootstrap-icons/bootstrap-icons.css" />
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body>
    <div class="d-flex flex-column align-items-center justify-content-center vh-100 gap-3">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Cargando…</span>
      </div>
      <p class="text-muted">Iniciando sesión con Google…</p>
    </div>

    <script defer src="../assets/js/api.js"></script>
    <script defer src="../assets/js/toast.js"></script>
    <script>
      // Los scripts de arriba tienen defer, así que esperamos al DOM para que api.js/toast.js ya existan.
      document.addEventListener("DOMContentLoaded", function () {
        // El backend nos devuelve el token en el fragmento (#token=...&nuevo=1 si es la 1ª vez).
        const params = new URLSearchParams(window.location.hash.substring(1));
        const token = params.get("token");
        const esNuevo = params.get("nuevo") === "1";

        if (token) {
          guardarToken(token);
          if (typeof toastFlash === "function") {
            toastFlash(
              esNuevo
                ? "¡Bienvenido a Gestión de Incidencias! Tu cuenta quedó creada con Google."
                : "Bienvenido",
              "success",
            );
          }
          // Entra a la pantalla de arranque según el rol (normal → mis incidencias).
          apiFetch("/user", { sinSpinner: true })
            .then(function (usuario) {
              const rol = usuario.rol ? usuario.rol.nombre_rol : "";
              window.location.replace(inicioSegunRol(rol));
            })
            .catch(function () {
              window.location.replace("../inicio/inicio.html");
            });
        } else {
          window.location.replace("login.html?error=google");
        }
      });
    </script>
  </body>
</html>
