<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Inicio de sesión - Sistema de Gestión de Incidencias" />
    <title>Iniciar sesión | Gestión de Incidencias</title>

    <!-- Estilos compartidos de la plantilla (un nivel arriba: login/ -> assets/) -->
    <link rel="stylesheet" href="../assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="../assets/vendors/bootstrap-icons/bootstrap-icons.css" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <!-- Estilos propios de esta página -->
    <link rel="stylesheet" href="login.css" />
  </head>

  <body class="auth-body">
    <button
      class="icon-button theme-toggle auth-theme-toggle"
      type="button"
      data-theme-toggle
      aria-label="Cambiar tema"
      title="Cambiar tema"
    >
      <i class="bi bi-moon-stars" data-theme-icon aria-hidden="true"></i>
    </button>

    <main class="auth-page">
      <section class="auth-card">
        <a class="auth-brand" href="../dashboard/dashboard.html">
          <span class="brand-icon"><i class="bi bi-geo-alt-fill" aria-hidden="true"></i></span>
          <span
            ><strong>Incidencias UPSE</strong
            ><small>Gestión de incidencias georreferenciadas</small></span
          >
        </a>

        <div class="auth-visual">
          <img src="../assets/images/png/banner-login.jpg" alt="Panel del sistema de incidencias" />
        </div>

        <!-- id="loginForm" -> login.js lo captura con addEventListener('submit') -->
        <form id="loginForm" class="needs-validation" novalidate>
          <div class="mb-4">
            <p class="eyebrow mb-1">Acceso seguro</p>
            <h1 class="h3 mb-1">Iniciar sesión</h1>
            <p class="text-muted mb-0">Ingresa con tu cuenta para gestionar incidencias.</p>
          </div>

          <!-- Aquí login.js mostrará "Credenciales incorrectas" u otros errores del backend.
             Empieza oculto (d-none) y se hace visible cuando haya un error. -->
          <div id="loginError" class="alert alert-danger d-none" role="alert"></div>

          <div class="mb-3">
            <label class="form-label" for="loginEmail">Correo electrónico</label>
            <input class="form-control" id="loginEmail" type="email" required />
            <div class="invalid-feedback">Ingresa un correo válido.</div>
          </div>

          <div class="mb-3">
            <label class="form-label" for="loginPassword">Contraseña</label>
            <input class="form-control" id="loginPassword" type="password" minlength="8" required />
            <div class="invalid-feedback">La contraseña debe tener al menos 8 caracteres.</div>
          </div>

          <button id="loginSubmit" class="btn btn-primary w-100" type="submit">
            <span
              id="loginSpinner"
              class="spinner-border spinner-border-sm d-none"
              role="status"
              aria-hidden="true"
            ></span>
            <i class="bi bi-box-arrow-in-right" aria-hidden="true"></i> Entrar
          </button>
        </form>

        <div class="auth-footer">
          ¿No tienes cuenta? <a href="../registro/registro.html">Crear una cuenta</a>
        </div>
      </section>
    </main>

    <!-- JS compartido de la plantilla -->
    <script src="../assets/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
    <!-- Capa de API compartida (define apiFetch, guardarToken, etc.) -->
    <script src="../assets/js/api.js"></script>
    <!-- Lógica propia de esta página -->
    <script src="login.js"></script>
  </body>
</html>
