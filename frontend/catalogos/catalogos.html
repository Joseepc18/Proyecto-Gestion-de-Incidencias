<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tipos de incidencia - Sistema de Gestión de Incidencias" />
    <title>Tipos de incidencia | Gestión de Incidencias</title>

    <link rel="stylesheet" href="../assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="../assets/vendors/bootstrap-icons/bootstrap-icons.css" />
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>

  <body data-page="catalogos">
    <div class="admin-shell">
      <div class="sidebar-backdrop" data-sidebar-close></div>

      <aside class="admin-sidebar" id="adminSidebar" aria-label="Navegación principal"></aside>

      <div class="admin-main">
        <nav class="navbar admin-navbar navbar-expand bg-white" id="adminNavbar"></nav>

        <main class="dashboard-content">
          <div class="container-fluid px-3 px-lg-4 py-4">
            <!-- Encabezado de página -->
            <div class="page-heading">
              <div class="page-heading-copy">
                <span class="page-icon"><i class="bi bi-diagram-3" aria-hidden="true"></i></span>
                <div>
                  <p class="eyebrow mb-1">Gestión</p>
                  <h1 class="h3 mb-1">Tipos de incidencia</h1>
                  <p class="text-muted mb-0">
                    Administra los tipos y subtipos de incidencia del sistema.
                  </p>
                </div>
              </div>
              <div class="heading-actions">
                <button class="btn btn-primary btn-sm" type="button" id="btnNuevoCatalogo">
                  <i class="bi bi-plus-lg" aria-hidden="true"></i> Nuevo
                </button>
              </div>
            </div>

            <!-- Panel: catálogo (tipos o subtipos según el toggle) -->
            <section class="panel">
              <div
                class="panel-header d-flex justify-content-between align-items-center flex-wrap gap-2"
              >
                <div class="btn-group btn-group-sm" role="group" aria-label="Tipos o subtipos">
                  <button class="btn btn-outline-primary active" type="button" data-vista="tipos">
                    <i class="bi bi-tag" aria-hidden="true"></i> Tipos
                  </button>
                  <button class="btn btn-outline-primary" type="button" data-vista="subtipos">
                    <i class="bi bi-tags" aria-hidden="true"></i> Subtipos
                  </button>
                </div>
                <div class="d-flex align-items-center gap-2 d-none" id="filtroSubtipoWrap">
                  <label for="filtroSubtipoTipo" class="form-label mb-0 small text-muted"
                    >Filtrar por tipo</label
                  >
                  <select
                    class="form-select form-select-sm w-auto"
                    id="filtroSubtipoTipo"
                    aria-label="Filtrar subtipos por tipo"
                  >
                    <option value="">Todos los tipos</option>
                  </select>
                </div>
              </div>
              <div class="table-responsive">
                <table class="table align-middle mb-0">
                  <thead id="theadCatalogo"></thead>
                  <tbody id="tbodyCatalogo">
                    <!-- catalogos.js llena esto dinámicamente -->
                  </tbody>
                </table>
              </div>
              <div id="contenedorPaginacion" class="px-3 pb-3"></div>
            </section>
          </div>
        </main>
      </div>
    </div>

    <!-- JS compartido -->
    <script src="../assets/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/toast.js"></script>
    <script src="../assets/js/confirmar.js"></script>
    <script src="../assets/js/modal.js"></script>
    <script src="../assets/js/layout.js"></script>
    <script src="../assets/js/notificaciones.js"></script>
    <script src="../assets/js/paginacion.js"></script>
    <!-- Lógica propia -->
    <script src="catalogos.js"></script>
  </body>
</html>
