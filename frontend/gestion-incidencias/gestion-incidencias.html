<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Incidencias - Sistema de Gestión de Incidencias" />
    <title>Incidencias | Gestión de Incidencias</title>

    <link rel="icon" href="../assets/images/favicon/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../assets/images/favicon/favicon-32x32.png"
    />
    <link rel="apple-touch-icon" href="../assets/images/favicon/apple-icon.png" />
    <script src="../assets/js/tema-inicial.js"></script>
    <link rel="stylesheet" href="../assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="../assets/vendors/bootstrap-icons/bootstrap-icons.css" />
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>

  <body data-page="gestion-incidencias">
    <div class="admin-shell">
      <div class="sidebar-backdrop" data-sidebar-close></div>

      <aside class="admin-sidebar" id="adminSidebar" aria-label="Navegación principal"></aside>

      <div class="admin-main">
        <nav class="navbar admin-navbar navbar-expand" id="adminNavbar"></nav>

        <main class="dashboard-content">
          <div class="container-fluid px-3 px-lg-4 py-4">
            <div class="page-heading">
              <div class="page-heading-copy">
                <span class="page-icon"><i class="bi bi-list-task" aria-hidden="true"></i></span>
                <div>
                  <p class="eyebrow mb-1">Gestión</p>
                  <h1 class="h3 mb-1">Incidencias</h1>
                  <p class="text-muted mb-0">
                    Consulta, crea y gestiona las incidencias reportadas.
                  </p>
                </div>
              </div>
            </div>

            <!-- Panel: filtros + tabla -->
            <section class="panel">
              <div class="panel-header">
                <div>
                  <h2 class="h5 mb-1 section-title">
                    <i class="bi bi-funnel" aria-hidden="true"></i>
                    <span id="tituloListado">Listado de incidencias</span>
                  </h2>
                </div>
                <div class="btn-group btn-group-sm" role="group" aria-label="Bandeja o archivo">
                  <button
                    type="button"
                    class="btn btn-outline-secondary active"
                    id="btnVistaBandeja"
                  >
                    <i class="bi bi-inbox me-1" aria-hidden="true"></i> Bandeja
                  </button>
                  <button type="button" class="btn btn-outline-secondary" id="btnVistaArchivo">
                    <i class="bi bi-archive me-1" aria-hidden="true"></i> Archivo
                  </button>
                </div>
              </div>

              <!-- Fila de filtros: busqueda siempre visible; el resto se colapsa en movil -->
              <div class="px-3 pb-3">
                <div class="d-flex gap-2 align-items-center">
                  <div class="campo-busqueda flex-grow-1">
                    <i class="bi bi-search busqueda-icono" aria-hidden="true"></i>
                    <input
                      class="form-control form-control-sm"
                      type="search"
                      id="filtroBusqueda"
                      placeholder="Buscar por título..."
                      aria-label="Buscar incidencias"
                    />
                  </div>
                  <button
                    class="btn btn-outline-secondary btn-sm d-md-none flex-shrink-0"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#filtrosGestion"
                    aria-expanded="false"
                    aria-controls="filtrosGestion"
                  >
                    <i class="bi bi-funnel" aria-hidden="true"></i> Filtros
                  </button>
                </div>
                <div class="collapse d-md-block mt-2" id="filtrosGestion">
                  <div class="row g-2">
                    <div class="col-12 col-md-3">
                      <select
                        class="form-select form-select-sm"
                        id="filtroEstado"
                        aria-label="Filtrar por estado"
                      >
                        <option value="">Todos los estados</option>
                        <option value="PENDIENTE">Pendiente</option>
                        <option value="EN_PROCESO">En proceso</option>
                        <option value="RESUELTO">Resuelto</option>
                      </select>
                    </div>
                    <div class="col-12 col-md-3">
                      <select
                        class="form-select form-select-sm"
                        id="filtroPrioridad"
                        aria-label="Filtrar por prioridad"
                      >
                        <option value="">Todas las prioridades</option>
                        <option value="ALTA">Alta</option>
                        <option value="MEDIA">Media</option>
                        <option value="BAJA">Baja</option>
                      </select>
                    </div>
                    <div class="col-12 col-md-3">
                      <select
                        class="form-select form-select-sm"
                        id="filtroTipo"
                        aria-label="Filtrar por tipo"
                      >
                        <option value="">Todos los tipos</option>
                        <!-- gestion-incidencias.js llena esto con GET /api/catalogos/tipos-incidencia -->
                      </select>
                    </div>
                    <div class="col-12 col-md-3">
                      <select
                        class="form-select form-select-sm"
                        id="filtroCiudad"
                        aria-label="Filtrar por ciudad"
                      >
                        <option value="">Todas las ciudades</option>
                        <!-- gestion-incidencias.js llena esto con GET /api/catalogos/ciudades -->
                      </select>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Tabla de incidencias -->
              <div class="table-responsive">
                <table class="table tabla-cards align-middle mb-0" id="tablaIncidencias">
                  <thead>
                    <tr>
                      <th>Título</th>
                      <th>Estado</th>
                      <th>Prioridad</th>
                      <th>Tipo</th>
                      <th>Ciudad</th>
                      <th>Atendido por</th>
                      <th>Fecha</th>
                      <th class="text-end">Acciones</th>
                    </tr>
                  </thead>
                  <tbody id="tbodyIncidencias">
                    <!-- gestion-incidencias.js llena esto dinámicamente -->
                  </tbody>
                </table>
              </div>

              <!-- Paginación -->
              <div id="contenedorPaginacion" class="px-3 pb-3"></div>
            </section>
          </div>
        </main>
      </div>
    </div>

    <script defer src="../assets/js/bootstrap.bundle.min.js"></script>
    <script defer src="../assets/vendors/main.js"></script>
    <script defer src="../assets/js/config.js"></script>
    <script defer src="../assets/js/api.js"></script>
    <script defer src="../assets/js/estados.js"></script>
    <script defer src="../assets/js/util.js"></script>
    <script defer src="../assets/js/sesion.js"></script>
    <script defer src="../assets/js/menuAcciones.js"></script>
    <script defer src="../assets/js/toast.js"></script>
    <script defer src="../assets/js/confirmar.js"></script>
    <script defer src="../assets/js/modal.js"></script>
    <script defer src="../assets/js/layout.js"></script>
    <script defer src="../assets/vendors/reverb/pusher.min.js"></script>
    <script defer src="../assets/vendors/reverb/echo.iife.js"></script>
    <script defer src="../assets/js/realtime.js"></script>
    <script defer src="../assets/js/notificaciones.js"></script>
    <script defer src="../assets/js/paginacion.js"></script>
    <script defer src="gestion-incidencias.js"></script>
  </body>
</html>
