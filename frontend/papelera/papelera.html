<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Papelera de incidencias - Sistema de Gestión de Incidencias"
    />
    <title>Papelera | Gestión de Incidencias</title>

    <link rel="icon" href="../assets/images/favicon/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../assets/images/favicon/favicon-32x32.png"
    />
    <link rel="apple-touch-icon" href="../assets/images/favicon/apple-icon.png" />
    <script src="../assets/js/tema-inicial.js"></script>
    <link rel="stylesheet" href="../assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="../assets/vendors/bootstrap-icons/bootstrap-icons.css" />
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>

  <body data-page="papelera">
    <div class="admin-shell">
      <div class="sidebar-backdrop" data-sidebar-close></div>

      <aside class="admin-sidebar" id="adminSidebar" aria-label="Navegación principal"></aside>

      <div class="admin-main">
        <nav class="navbar admin-navbar navbar-expand" id="adminNavbar"></nav>

        <main class="dashboard-content">
          <div class="container-fluid px-3 px-lg-4 py-4">
            <div class="page-heading">
              <div class="page-heading-copy">
                <span class="page-icon"><i class="bi bi-trash3" aria-hidden="true"></i></span>
                <div>
                  <p class="eyebrow mb-1">Administración</p>
                  <h1 class="h3 mb-1">Papelera</h1>
                  <p class="text-muted mb-0">
                    Incidencias en la papelera. Restáuralas o bórralas para siempre.
                  </p>
                </div>
              </div>
            </div>

            <section class="panel">
              <div class="panel-header">
                <div>
                  <h2 class="h5 mb-1 section-title">
                    <i class="bi bi-funnel" aria-hidden="true"></i>
                    <span>Incidencias en la papelera</span>
                  </h2>
                </div>
              </div>

              <div class="px-3 pb-3">
                <div class="campo-busqueda">
                  <i class="bi bi-search busqueda-icono" aria-hidden="true"></i>
                  <input
                    class="form-control form-control-sm"
                    type="search"
                    id="filtroBusqueda"
                    placeholder="Buscar por título..."
                    aria-label="Buscar incidencias en la papelera"
                  />
                </div>
              </div>

              <div class="table-responsive">
                <table class="table tabla-cards align-middle mb-0" id="tablaPapelera">
                  <thead>
                    <tr>
                      <th>Título</th>
                      <th>Tipo</th>
                      <th>Ciudad</th>
                      <th>En papelera desde</th>
                      <th>Se elimina en</th>
                      <th class="text-end">Acciones</th>
                    </tr>
                  </thead>
                  <tbody id="tbodyPapelera">
                    <!-- papelera.js llena esto dinámicamente -->
                  </tbody>
                </table>
              </div>

              <div id="contenedorPaginacion" class="px-3 pb-3"></div>
            </section>
          </div>
        </main>
      </div>
    </div>

    <script defer src="../assets/js/bootstrap.bundle.min.js"></script>
    <script defer src="../assets/vendors/main.js"></script>
    <script defer src="../assets/js/config.js"></script>
    <script defer src="../assets/js/api.js"></script>
    <script defer src="../assets/js/util.js"></script>
    <script defer src="../assets/js/sesion.js"></script>
    <script defer src="../assets/js/menuAcciones.js"></script>
    <script defer src="../assets/js/toast.js"></script>
    <script defer src="../assets/js/confirmar.js"></script>
    <script defer src="../assets/js/layout.js"></script>
    <script defer src="../assets/vendors/reverb/pusher.min.js"></script>
    <script defer src="../assets/vendors/reverb/echo.iife.js"></script>
    <script defer src="../assets/js/realtime.js"></script>
    <script defer src="../assets/js/notificaciones.js"></script>
    <script defer src="../assets/js/paginacion.js"></script>
    <script defer src="papelera.js"></script>
  </body>
</html>
