<!doctype html>
<html lang="es">

    <link rel="icon" href="../assets/images/favicon/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../assets/images/favicon/favicon-32x32.png"
    />
    <link rel="apple-touch-icon" href="../assets/images/favicon/apple-icon.png" />
    <script src="../assets/js/tema-inicial.js"></script>
    <link rel="stylesheet" href="../assets/css/bootstrap.min.css" />

  <body data-page="permisos">
    <div class="admin-shell">
      <div class="sidebar-backdrop" data-sidebar-close></div>

      <aside class="admin-sidebar" id="adminSidebar" aria-label="Navegación principal"></aside>

      <div class="admin-main">
        <nav class="navbar admin-navbar navbar-expand" id="adminNavbar"></nav>

        <main class="dashboard-content">
          <div class="container-fluid px-3 px-lg-4 py-4">

                <span class="page-icon"><i class="bi bi-shield-lock" aria-hidden="true"></i></span>
                <div>
                  <p class="eyebrow mb-1">Administración</p>
                  <h1 class="h3 mb-1">Permisos por rol</h1>
                  <p class="text-muted mb-0">
                    Marca qué puede hacer cada rol. El rol super_admin no se puede modificar.
                  </p>
                </div>
              </div>
              <div class="heading-actions">
                <button class="btn btn-primary btn-sm" type="button" id="btnGuardar" disabled>
                  <i class="bi bi-check-lg" aria-hidden="true"></i> Guardar cambios
                </button>
              </div>
            </div>

            <section class="panel">
              <div class="table-responsive">
                <table class="table tabla-cards align-middle mb-0" id="tablaPermisos">
                  <thead id="theadPermisos"></thead>
                  <tbody id="tbodyPermisos">
                    <!-- permisos.js llena esto dinámicamente -->
                  </tbody>
                </table>
              </div>
            </section>
          </div>
        </main>
      </div>

    <script defer src="../assets/js/realtime.js"></script>
