<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Mis incidencias - Sistema de Gestión de Incidencias" />
    <title>Mis incidencias | Gestión de Incidencias</title>

    <link rel="stylesheet" href="../assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="../assets/vendors/bootstrap-icons/bootstrap-icons.css" />
    <link rel="stylesheet" href="../assets/vendors/leaflet/leaflet.css" />
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>

  <body data-page="misIncidencias">
    <div class="admin-shell">
      <div class="sidebar-backdrop" data-sidebar-close></div>

      <!-- Sidebar -->
      <aside class="admin-sidebar" id="adminSidebar" aria-label="Navegación principal"></aside>

      <div class="admin-main">
        <!-- Navbar -->
        <nav class="navbar admin-navbar navbar-expand bg-white" id="adminNavbar"></nav>

        <!-- Contenido: mapa de fondo + paneles flotantes (estilo centro de control) -->
        <main class="dashboard-content mis-mapa-main">
          <!-- Mapa -->
          <div id="mapaMisIncidencias" class="mis-mapa"></div>

          <!-- Panel flotante izquierdo: feed de incidencias -->
          <section class="mis-panel mis-feed" id="feedPanel">
            <div class="mis-feed-header">
              <h2 class="h6 mb-2">Mis Incidencias</h2>
              <div class="input-group input-group-sm">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input
                  type="text"
                  class="form-control"
                  id="filtroBusqueda"
                  placeholder="Buscar incidencia..."
                />
              </div>
            </div>

            <!-- Lista de tarjetas (la llena el JS) -->
            <div id="listaIncidencias" class="mis-feed-lista d-flex flex-column gap-2 mt-2"></div>

            <p class="text-muted small mb-0 mt-2" id="listaInfo"></p>
          </section>

          <!-- Tarjeta flotante derecha: detalle (compacto + expandible hacia arriba) -->
          <section class="mis-panel mis-detalle" id="detalleCard">
            <!-- Estado vacío -->
            <div id="detalleVacio" class="text-center text-muted p-3">
              <i class="bi bi-geo-alt fs-3 d-block mb-2"></i>
              <p class="small mb-0">Selecciona una incidencia para ver su detalle y ubicación.</p>
            </div>

            <!-- Contenido (oculto hasta seleccionar) -->
            <div id="detalleContenido" class="d-none">
              <!-- Cabecera compacta -->
              <div class="mis-detalle-head">
                <img id="detalleImagen" class="mis-detalle-img d-none" alt="Evidencia" />
                <div class="d-flex justify-content-between align-items-start gap-2">
                  <div>
                    <p class="eyebrow mb-1" id="detalleCodigo">INC-...</p>
                    <h1 class="h6 mb-1" id="detalleTitulo"></h1>
                  </div>
                  <span class="badge" id="detalleEstado"></span>
                </div>

                <div class="d-flex gap-2 align-items-center flex-wrap mt-1">
                  <span class="badge" id="detallePrioridad"></span>
                  <span class="text-muted small" id="detalleFecha"></span>
                </div>

                <p class="small text-muted mb-0 mt-2" id="detalleUbicacion"></p>

                <div class="d-flex gap-2 mt-2">
                  <button
                    class="btn btn-outline-secondary btn-sm"
                    type="button"
                    id="btnExpandir"
                    aria-expanded="false"
                  >
                    <i class="bi bi-chevron-up me-1" id="btnExpandirIcono"></i>
                    <span id="btnExpandirTexto">Expandir detalles</span>
                  </button>
                </div>

                <!-- Aviso cuando ya no se puede editar -->
                <div id="avisoEdicion" class="alert alert-info py-1 px-2 small mt-2 mb-0 d-none">
                  <i class="bi bi-info-circle me-1"></i>
                  Ya está en proceso, no puedes editarla.
                  <a href="#" id="linkComentarios" class="alert-link">Usa los comentarios.</a>
                </div>
              </div>

              <!-- Sección expandible -->
              <div id="detalleExpandido" class="mis-detalle-expandido d-none">
                <div class="mis-detalle-seccion">
                  <h3 class="h6 text-primary mb-2">Información General</h3>
                  <h6 class="text-muted mb-1 small">Descripción</h6>
                  <p id="detalleDescripcion" class="mb-2 small"></p>
                  <h6 class="text-muted mb-1 small">Tipo</h6>
                  <p id="detalleTipo" class="mb-2 small fw-semibold"></p>
                  <h6 class="text-muted mb-1 small">Subtipo</h6>
                  <p id="detalleSubtipo" class="mb-0 small fw-semibold"></p>
                </div>

                <div class="mis-detalle-seccion">
                  <h3 class="h6 text-primary mb-2">Responsables</h3>
                  <div id="misResponsables"></div>
                </div>

                <div class="mis-detalle-seccion" id="detalleEvidenciasBloque">
                  <h3 class="h6 text-primary mb-2">Evidencias</h3>
                  <div id="detalleEvidencias" class="d-flex gap-2 flex-wrap"></div>
                </div>

                <div class="mis-detalle-seccion">
                  <h3 class="h6 text-primary mb-2">Seguimiento</h3>
                  <div id="detalleComentarios" class="d-flex flex-column gap-2 mb-2"></div>
                  <form id="formComentario" class="d-flex flex-column gap-2">
                    <textarea
                      class="form-control form-control-sm"
                      id="nuevoComentario"
                      rows="2"
                      placeholder="Escribe un comentario..."
                      required
                    ></textarea>
                    <div class="d-flex justify-content-end">
                      <button class="btn btn-primary btn-sm" type="submit" id="btnEnviarComentario">
                        <span
                          id="comentarioSpinner"
                          class="spinner-border spinner-border-sm d-none me-1"
                        ></span>
                        <i class="bi bi-send me-1"></i> Enviar
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <!-- JS compartido -->
    <script src="../assets/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/toast.js"></script>
    <script src="../assets/js/confirmar.js"></script>
    <script src="../assets/js/lightbox.js"></script>
    <script src="../assets/js/layout.js"></script>
    <script src="../assets/js/notificaciones.js"></script>
    <!-- Mapa -->
    <script src="../assets/vendors/leaflet/leaflet.js"></script>
    <script src="../assets/js/mapa.js"></script>
    <!-- Lógica propia -->
    <script src="misIncidencias.js"></script>
  </body>
</html>
