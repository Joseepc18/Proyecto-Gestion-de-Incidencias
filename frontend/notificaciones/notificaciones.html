<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Notificaciones - Sistema de Gestión de Incidencias" />
    <title>Notificaciones | Gestión de Incidencias</title>

    <link rel="icon" href="../assets/images/favicon/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../assets/images/favicon/favicon-32x32.png"
    />
    <link rel="apple-touch-icon" href="../assets/images/favicon/apple-icon.png" />
    <script src="../assets/js/tema-inicial.js"></script>
    <link rel="stylesheet" href="../assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="../assets/vendors/bootstrap-icons/bootstrap-icons.css" />
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>

  <body data-page="notificaciones">
    <div class="admin-shell">
      <div class="sidebar-backdrop" data-sidebar-close></div>

      <aside class="admin-sidebar" id="adminSidebar" aria-label="Navegación principal"></aside>

      <div class="admin-main">
        <nav class="navbar admin-navbar navbar-expand" id="adminNavbar"></nav>

        <main class="dashboard-content">
          <div class="container-fluid px-3 px-lg-4 py-4">
            <!-- Encabezado de página -->
            <div class="page-heading">
              <div class="page-heading-copy">
                <span class="page-icon"><i class="bi bi-mailbox" aria-hidden="true"></i></span>
                <div>
                  <p class="eyebrow mb-1">Actividad</p>
                  <h1 class="h3 mb-1">Notificaciones</h1>
                  <p class="text-muted mb-0">Todo lo que ha pasado en tus incidencias.</p>
                </div>
              </div>
            </div>

            <!-- Panel: bandeja de notificaciones -->
            <section class="panel">
              <div
                class="panel-header d-flex flex-wrap align-items-center justify-content-between gap-2"
              >
                <h2 class="h5 mb-0 section-title">
                  <i class="bi bi-bell" aria-hidden="true"></i>
                  <span>Tus notificaciones</span>
                  <span class="text-muted fw-normal small" id="contadorNoLeidas"></span>
                </h2>
                <div class="d-flex align-items-center gap-2">
                  <div class="btn-group btn-group-sm" role="group" aria-label="Filtro">
                    <button
                      type="button"
                      class="btn btn-outline-secondary active"
                      data-filtro="todas"
                    >
                      Todas
                    </button>
                    <button type="button" class="btn btn-outline-secondary" data-filtro="no_leidas">
                      No leídas
                    </button>
                  </div>
                  <button type="button" class="btn btn-sm btn-primary" id="btnMarcarTodasPag">
                    <i class="bi bi-check2-all me-1" aria-hidden="true"></i>Marcar todas
                  </button>
                </div>
              </div>
              <div id="listaNotificaciones" class="notif-page-list">
                <!-- notificaciones.js llena esto dinámicamente -->
              </div>
            </section>
          </div>
        </main>
      </div>
    </div>

    <!-- JS compartido -->
    <script defer src="../assets/js/bootstrap.bundle.min.js"></script>
    <script defer src="../assets/vendors/main.js"></script>
    <script defer src="../assets/js/config.js"></script>
    <script defer src="../assets/js/api.js"></script>
    <script defer src="../assets/js/util.js"></script>
    <script defer src="../assets/js/sesion.js"></script>
    <script defer src="../assets/js/toast.js"></script>
    <script defer src="../assets/js/confirmar.js"></script>
    <script defer src="../assets/js/layout.js"></script>
    <script defer src="../assets/js/notificaciones.js"></script>
    <!-- Lógica propia -->
    <script defer src="notificaciones.js"></script>
  </body>
</html>
