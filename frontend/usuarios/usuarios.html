<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Usuarios - Sistema de Gestión de Incidencias" />
    <title>Usuarios | Gestión de Incidencias</title>

    <link rel="stylesheet" href="../assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="../assets/vendors/bootstrap-icons/bootstrap-icons.css" />
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>

  <body data-page="usuarios">
    <div class="admin-shell">
      <div class="sidebar-backdrop" data-sidebar-close></div>

      <aside class="admin-sidebar" id="adminSidebar" aria-label="Navegación principal"></aside>

      <div class="admin-main">
        <nav class="navbar admin-navbar navbar-expand bg-white" id="adminNavbar"></nav>

        <main class="dashboard-content">
          <div class="container-fluid px-3 px-lg-4 py-4">
            <!-- Encabezado de página -->
            <div class="page-heading">
              <div class="page-heading-copy">
                <span class="page-icon"><i class="bi bi-people" aria-hidden="true"></i></span>
                <div>
                  <p class="eyebrow mb-1">Gestión</p>
                  <h1 class="h3 mb-1">Usuarios</h1>
                  <p class="text-muted mb-0">Crea y administra las cuentas del sistema.</p>
                </div>
              </div>
              <div class="heading-actions">
                <button class="btn btn-primary btn-sm" type="button" id="btnNuevoUsuario">
                  <i class="bi bi-person-plus" aria-hidden="true"></i> Nuevo usuario
                </button>
              </div>
            </div>

            <!-- Panel: listado de usuarios -->
            <section class="panel">
              <div class="panel-header">
                <h2 class="h5 mb-0 section-title">
                  <i class="bi bi-list-ul" aria-hidden="true"></i>
                  <span>Listado de usuarios</span>
                </h2>

                <div class="dropdown">
                  <button
                    class="btn btn-light btn-sm dropdown-toggle"
                    type="button"
                    id="btnFiltroRol"
                    data-bs-toggle="dropdown"
                    aria-expanded="false"
                  >
                    <i class="bi bi-funnel me-1" aria-hidden="true"></i
                    ><span id="filtroRolTexto">Todos</span>
                  </button>
                  <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="btnFiltroRol">
                    <li><a class="dropdown-item" href="#" data-rol="">Todos</a></li>
                    <li><a class="dropdown-item" href="#" data-rol="admin">Administradores</a></li>
                    <li><a class="dropdown-item" href="#" data-rol="tecnico">Técnicos</a></li>
                    <li><a class="dropdown-item" href="#" data-rol="normal">Normales</a></li>
                    <li><hr class="dropdown-divider" /></li>
                    <li>
                      <a class="dropdown-item text-warning" href="#" data-rol="suspendido">
                        <i class="bi bi-slash-circle me-1" aria-hidden="true"></i>Suspendidos
                      </a>
                    </li>
                  </ul>
                </div>
              </div>
              <div class="table-responsive">
                <table class="table align-middle mb-0">
                  <thead>
                    <tr>
                      <th></th>
                      <th>Nombre</th>
                      <th>Correo</th>
                      <th>Rol</th>
                      <th class="text-end">Acciones</th>
                    </tr>
                  </thead>
                  <tbody id="tbodyUsuarios">
                    <!-- usuarios.js llena esto dinámicamente -->
                  </tbody>
                </table>
              </div>
              <div id="contenedorPaginacion" class="px-3 pb-3"></div>
            </section>
          </div>
        </main>
      </div>
    </div>

    <!-- JS compartido -->
    <script src="../assets/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/toast.js"></script>
    <script src="../assets/js/confirmar.js"></script>
    <script src="../assets/js/modal.js"></script>
    <script src="../assets/js/password.js"></script>
    <script src="../assets/js/layout.js"></script>
    <script src="../assets/js/notificaciones.js"></script>
    <script src="../assets/js/paginacion.js"></script>
    <!-- Lógica propia -->
    <script src="usuarios.js"></script>
  </body>
</html>
