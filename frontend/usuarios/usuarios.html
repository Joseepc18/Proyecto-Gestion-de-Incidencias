<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Usuarios - Sistema de Gestión de Incidencias" />
    <title>Usuarios | Gestión de Incidencias</title>

    <link rel="stylesheet" href="../assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="../assets/vendors/bootstrap-icons/bootstrap-icons.css" />
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>

  <body data-page="usuarios">
    <div class="admin-shell">
      <div class="sidebar-backdrop" data-sidebar-close></div>

      <aside class="admin-sidebar" id="adminSidebar" aria-label="Navegación principal"></aside>

      <div class="admin-main">
        <nav class="navbar admin-navbar navbar-expand bg-white" id="adminNavbar"></nav>

        <main class="dashboard-content">
          <div class="container-fluid px-3 px-lg-4 py-4">
            <!-- Encabezado de página -->
            <div class="page-heading">
              <div class="page-heading-copy">
                <span class="page-icon"><i class="bi bi-people" aria-hidden="true"></i></span>
                <div>
                  <p class="eyebrow mb-1">Gestión</p>
                  <h1 class="h3 mb-1">Usuarios</h1>
                  <p class="text-muted mb-0">Crea y administra las cuentas del sistema.</p>
                </div>
              </div>
            </div>

            <!-- Panel: crear usuario -->
            <section class="panel mb-4">
              <div class="panel-header">
                <h2 class="h5 mb-0 section-title">
                  <i class="bi bi-person-plus" aria-hidden="true"></i>
                  <span id="tituloFormUsuario">Nuevo usuario</span>
                </h2>
              </div>
              <div class="p-3">
                <form id="formUsuario" class="row g-2 align-items-end">
                  <div class="col-md-3">
                    <label for="usuarioNombre" class="form-label">Nombre</label>
                    <input
                      class="form-control form-control-sm"
                      type="text"
                      id="usuarioNombre"
                      required
                    />
                  </div>
                  <div class="col-md-3">
                    <label for="usuarioEmail" class="form-label">Correo</label>
                    <input
                      class="form-control form-control-sm"
                      type="email"
                      id="usuarioEmail"
                      required
                    />
                  </div>
                  <div class="col-md-2">
                    <label for="usuarioPassword" class="form-label">Contraseña</label>
                    <input
                      class="form-control form-control-sm"
                      type="password"
                      id="usuarioPassword"
                      minlength="8"
                      required
                    />
                  </div>
                  <div class="col-md-2">
                    <label for="usuarioRol" class="form-label">Rol</label>
                    <select class="form-select form-select-sm" id="usuarioRol" required>
                      <option value="">Seleccionar...</option>
                    </select>
                  </div>
                  <div class="col-md-2">
                    <button class="btn btn-primary btn-sm w-100" type="submit" id="btnCrearUsuario">
                      <span
                        class="spinner-border spinner-border-sm me-1 d-none"
                        id="usuarioSpinner"
                        role="status"
                      ></span>
                      <span id="btnUsuarioTexto"
                        ><i class="bi bi-plus-lg" aria-hidden="true"></i> Crear</span
                      >
                    </button>
                    <button
                      class="btn btn-outline-secondary btn-sm w-100 mt-1 d-none"
                      type="button"
                      id="btnCancelarEdicion"
                    >
                      <i class="bi bi-x-lg" aria-hidden="true"></i> Cancelar
                    </button>
                  </div>
                </form>
              </div>
            </section>

            <!-- Panel: listado de usuarios -->
            <section class="panel">
              <div class="panel-header">
                <h2 class="h5 mb-0 section-title">
                  <i class="bi bi-list-ul" aria-hidden="true"></i>
                  <span>Listado de usuarios</span>
                </h2>
              </div>
              <div class="table-responsive">
                <table class="table align-middle mb-0">
                  <thead>
                    <tr>
                      <th>Nombre</th>
                      <th>Correo</th>
                      <th>Rol</th>
                      <th class="text-end">Acciones</th>
                    </tr>
                  </thead>
                  <tbody id="tbodyUsuarios">
                    <!-- usuarios.js llena esto dinámicamente -->
                  </tbody>
                </table>
              </div>
            </section>
          </div>
        </main>
      </div>
    </div>

    <!-- JS compartido -->
    <script src="../assets/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/toast.js"></script>
    <script src="../assets/js/confirmar.js"></script>
    <script src="../assets/js/layout.js"></script>
    <!-- Lógica propia -->
    <script src="usuarios.js"></script>
  </body>
</html>
