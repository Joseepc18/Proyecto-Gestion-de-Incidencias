<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Error del servidor - Gestión de Incidencias" />
    <title>Error del servidor | Gestión de Incidencias</title>

    <link rel="icon" href="../assets/images/favicon/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../assets/images/favicon/favicon-32x32.png"
    />
    <link rel="apple-touch-icon" href="../assets/images/favicon/apple-icon.png" />
    <script src="../assets/js/tema-inicial.js"></script>
    <link rel="stylesheet" href="../assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="../assets/vendors/bootstrap-icons/bootstrap-icons.css" />
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>

  <body class="auth-body">
    <button
      class="icon-button theme-toggle auth-theme-toggle"
      type="button"
      data-theme-toggle
      aria-label="Cambiar tema"
      title="Cambiar tema"
    >
      <i class="bi bi-moon-stars" data-theme-icon aria-hidden="true"></i>
    </button>

    <main class="error-page">
      <div class="error-brand">
        <i class="bi bi-geo-alt-fill" aria-hidden="true"></i>
        <span data-app-nombre></span>
      </div>
      <p class="error-codigo">500</p>
      <i class="bi bi-cone-striped error-icono" aria-hidden="true"></i>
      <h1 class="h3 mb-2">Algo falló de nuestro lado</h1>
      <p class="text-muted mb-4">
        El servidor tuvo un problema al procesar tu solicitud. Inténtalo de nuevo en unos minutos.
      </p>
      <div class="d-flex flex-wrap justify-content-center gap-2">
        <button class="btn btn-primary" type="button" id="btnReintentar">
          <i class="bi bi-arrow-clockwise me-1"></i> Reintentar
        </button>
        <a class="btn btn-outline-secondary" href="../login/login.html">
          <i class="bi bi-house-door me-1"></i> Ir al inicio
        </a>
      </div>
    </main>

    <script defer src="../assets/vendors/main.js"></script>
    <script defer src="../assets/js/config.js"></script>
    <script defer src="500.js"></script>
  </body>
</html>
